services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
  k6:
    image: grafana/k6:1.8.1
    profiles:
      - performance
    volumes:
      - ./performance/k6:/scripts:ro
    working_dir: /scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"