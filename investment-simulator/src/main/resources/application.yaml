spring:
  application:
    name: investment-simulator
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 2s
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

server:
  tomcat:
    mbeanregistry:
      enabled: true

market-data:
  base-url: http://localhost:8081
